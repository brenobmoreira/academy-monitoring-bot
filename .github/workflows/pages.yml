name: Deploy Mini App (Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/miniapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check and test Mini App
        run: |
          npm run check
          node --test apps/miniapp/test/*.test.js

      - name: Stage production bundle
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/data _site/src
          grep -v 'src="dev/voice-stub.js"' apps/miniapp/index.html > _site/index.html
          cp apps/miniapp/styles.css _site/styles.css
          cp apps/miniapp/assets/shape.svg _site/assets/shape.svg
          cp apps/miniapp/data/foods.taco.json _site/data/foods.taco.json
          cp \
            apps/miniapp/src/app.js \
            apps/miniapp/src/avatar.js \
            apps/miniapp/src/body.js \
            apps/miniapp/src/core.js \
            apps/miniapp/src/motion.js \
            apps/miniapp/src/muscle-motion.js \
            apps/miniapp/src/voice.js \
            _site/src/
          test ! -d _site/dev && test ! -d _site/test && test ! -f _site/motion-demo.html && test -s _site/index.html && ! grep -q 'dev/voice-stub.js' _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
