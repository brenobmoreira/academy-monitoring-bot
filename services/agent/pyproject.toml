[project]
name = "agent"
version = "0.1.0"
description = "Telegram fitness-log agent (Google ADK) that writes through the Apps Script sheet API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "functions-framework>=3.10.2",
    "google-adk>=2.10.0",
    "httpx>=0.28.1",
    "litellm>=1.102.1",
    "pydantic-settings[yaml]>=2.15.0",
    "python-dotenv>=1.2.3",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-poll = "agent.poll:main"
agent-commands = "agent.commands:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: fast tests with no network"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# Settings fields are named after their environment variables (UPPER_CASE), which SIM300 mistakes
# for constants and flags every `settings.X == value` comparison.
ignore = ["SIM300"]
