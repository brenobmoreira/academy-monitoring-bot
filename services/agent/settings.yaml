# Agent settings that are safe to publish. Loaded once when the process starts.
#
# Precedence (highest first): environment variables > .env > this file > defaults in settings.py.
# Keys are the environment variable names; any of them set in the environment wins over this file.
#
# Changing a value without rebuilding: point SETTINGS_FILE at a copy mounted into the container
# (on Cloud Run, a Secret Manager secret mounted as a file) and restart the instances.
#
# Secrets (tokens, API keys) are refused here: they come only from the environment.

# Model, in LiteLLM's "<provider>/<model>" form; the provider needs a matching LLM_API_KEY.
#   gemini/gemini-3.8-flash         Google AI Studio   (prices: ai.google.dev/gemini-api/docs/pricing)
#   vertex_ai/gemini-3.8-flash      Vertex AI, no key  (VERTEXAI_PROJECT / VERTEXAI_LOCATION in the env)
#   anthropic/claude-sonnet-5       Anthropic
#   openai/gpt-5.6                  OpenAI
#   ollama/llama3                   local, with LLM_API_BASE=http://localhost:11434
LLM_MODEL: gemini/gemini-3.8-flash

# Maximum model calls per Telegram message (tool calls and corrections included).
MAX_LLM_CALLS: 8

# A provider that answers "overloaded" (503), "rate limited" (429) or 500 is tried again
# LLM_RETRIES times, waiting LLM_RETRY_WAIT_S seconds, then twice that, and so on. After that,
# LLM_FALLBACK_MODEL gets the same treatment. It uses LLM_API_KEY (same provider) unless
# LLM_FALLBACK_API_KEY is set in the environment, which allows another provider: a Gemini
# incident then does not take the fallback down with it.
# Unset fallback = the person gets "O modelo não respondeu agora" after the retries.
LLM_RETRIES: 2
LLM_RETRY_WAIT_S: 2
# LLM_FALLBACK_MODEL: gemini/gemini-3.7-flash        (same key)
# LLM_FALLBACK_MODEL: anthropic/claude-haiku-5-5     (needs LLM_FALLBACK_API_KEY)

# Seconds one model call may take; a call that times out goes straight to LLM_FALLBACK_MODEL.
# (LiteLLM alone would wait 6000 s for a provider that hangs instead of answering 503.)
LLM_TIMEOUT_S: 30

# Seconds one Telegram message may take end to end (all model calls, retries and the fallback).
# Keep it below the webhook's request timeout (Cloud Run: 120 s) so the person always gets
# "O modelo não respondeu agora" instead of silence.
MESSAGE_DEADLINE_S: 90

# Resolves "hoje", "ontem" and weekdays in the agent instruction.
TIMEZONE: America/Sao_Paulo

# Voice, audio and photo messages go to the model (which must accept audio and images; Gemini
# does). false = they get a "send it as text" reply and are never downloaded.
MEDIA_ENABLED: true

# Largest voice/audio/photo downloaded, in bytes (at most 20000000, the Bot API's limit).
MEDIA_MAX_BYTES: 5000000

# --- Voice transcription (voice spec, §3.1 and §5.6) --------------------------------------------
# Audio goes to a Gemini model only (gemini/... or vertex_ai/...). TRANSCRIBE_API_KEY comes from the
# environment; it defaults to LLM_API_KEY when LLM_MODEL is also a gemini model.
TRANSCRIBE_MODEL: gemini/gemini-3.8-flash
# TRANSCRIBE_FALLBACK_MODEL: gemini/gemini-3.7-flash   (same provider = same key)

# Seconds per attempt, retries per model (the wait doubles), and the hard limit for the whole
# transcription (every attempt, wait and fallback).
TRANSCRIBE_TIMEOUT_S: 15
TRANSCRIBE_RETRIES: 1
TRANSCRIBE_RETRY_WAIT_S: 1.0
TRANSCRIBE_DEADLINE_S: 45

# Longest voice note, in seconds.
VOICE_MAX_SECONDS: 90

# Token budgets, per day (in TIMEZONE) and per process: approximate, kept in memory, renewed at
# midnight and at every restart. The provider's own spend cap is the real ceiling.
VOICE_DAILY_TOKENS: 120000
VOICE_GLOBAL_DAILY_TOKENS: 500000
# Lowest bitrate an accepted audio format can have; sizes a reservation from the body size when the
# duration cannot be trusted.
VOICE_MIN_BITRATE_BPS: 6000

# --- Mini App voice (voice spec, §6.2, §7.1 and §13) -------------------------------------------
# HTTPS origin of the voice service (no path or trailing slash), paired with APP_AUTH_SECRET in the
# environment (at least 32 bytes; both set or both unset).
# VOICE_API_URL: https://voice.example.com
# APP_CODE_TTL_S: 900
