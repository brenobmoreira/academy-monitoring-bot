# Agent settings that are safe to publish. Loaded once when the process starts.
#
# Precedence (highest first): environment variables > .env > this file > defaults in settings.py.
# Keys are the environment variable names; any of them set in the environment wins over this file.
#
# Changing a value without rebuilding: point SETTINGS_FILE at a copy mounted into the container
# (on Cloud Run, a Secret Manager secret mounted as a file) and restart the instances.
#
# Secrets (tokens, API keys) are refused here: they come only from the environment.

# Model, in LiteLLM's "<provider>/<model>" form; the provider needs a matching LLM_API_KEY.
#   gemini/gemini-3.8-flash         Google AI Studio   (prices: ai.google.dev/gemini-api/docs/pricing)
#   vertex_ai/gemini-3.8-flash      Vertex AI, no key  (VERTEXAI_PROJECT / VERTEXAI_LOCATION in the env)
#   anthropic/claude-sonnet-5       Anthropic
#   openai/gpt-5.6                  OpenAI
#   ollama/llama3                   local, with LLM_API_BASE=http://localhost:11434
LLM_MODEL: gemini/gemini-3.8-flash

# Maximum model calls per Telegram message (tool calls and corrections included).
MAX_LLM_CALLS: 8

# A provider that answers "overloaded" (503), "rate limited" (429) or 500 is tried again
# LLM_RETRIES times, waiting LLM_RETRY_WAIT_S seconds, then twice that, and so on. After that,
# LLM_FALLBACK_MODEL (same provider: it uses the same LLM_API_KEY) gets the same treatment.
# Unset fallback = the person gets "O modelo não respondeu agora" after the retries.
LLM_RETRIES: 2
LLM_RETRY_WAIT_S: 2
# LLM_FALLBACK_MODEL: gemini/gemini-3.7-flash

# Seconds one model call may take; a call that times out goes straight to LLM_FALLBACK_MODEL.
# (LiteLLM alone would wait 6000 s for a provider that hangs instead of answering 503.)
LLM_TIMEOUT_S: 30

# Resolves "hoje", "ontem" and weekdays in the agent instruction.
TIMEZONE: America/Sao_Paulo

# Voice, audio and photo messages go to the model (which must accept audio and images; Gemini
# does). false = they get a "send it as text" reply and are never downloaded.
MEDIA_ENABLED: true

# Largest voice/audio/photo downloaded, in bytes (at most 20000000, the Bot API's limit).
MEDIA_MAX_BYTES: 5000000
